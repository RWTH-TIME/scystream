name: CI
on:
  push:
    branches:
      - 'main'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup nodejs
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run linter
        working-directory: ./frontend
        run: npm run lint

  lint-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup python
        uses: actions/setup-python@v7.0.0
        with:
          cache: 'pip'

      - name: Run flake8
        uses: py-actions/flake8@v2.3.0
        with:
          exclude: "core/alembic/versions/"
          path: "core"

  test-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
          cache: 'pip'
          cache-dependency-path: core/requirements*.txt

      - name: Install requirements
        working-directory: ./core
        run: pip install -r requirements-dev.txt

      # integration tests are skipped here, they run in the airflow and
      # superset workflows against real services
      - name: Run unit tests
        working-directory: ./core
        run: pytest -v

  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Validate docker compose files
        env:
          AIRFLOW_UID: '50000'
          SSH_AUTH_SOCK: /tmp/ssh-agent.sock
        run: |
          for file in docker-compose.yml docker-compose.dev.yml superset/docker-compose.test.yml; do
            echo "Validating $file"
            docker compose -f "$file" config --quiet
          done

  build:
    name: Build docker image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: frontend
          - context: core
          - context: superset
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.context }}
          tags: |
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      
      - name: Define build args
        id: define_build_args
        run: |
          if [ "${{ matrix.context }}" == "frontend" ]; then
            echo "BUILD_ARGS=NEXT_PUBLIC_API_URL=${{ secrets.BUILD_API_URL }}" >> "$GITHUB_ENV"
          else
            echo "BUILD_ARGS=" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push docker images
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          # Pull requests from forks have no access to the registry
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ env.BUILD_ARGS }}
          # reuse unchanged layers (dependencies) between CI runs
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}
