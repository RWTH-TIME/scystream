# Stack used by the superset integration and end to end tests (see
# .github/workflows/superset.yaml and core/tests/integration). Superset uses
# its own user database here, so no Keycloak is required.
#
#   docker compose -f superset/docker-compose.test.yml up -d --build --wait
services:
  superset-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset -q"]
      interval: 5s
      retries: 20

  data-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    networks:
      default:
        aliases:
          - template-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -q"]
      interval: 5s
      retries: 20

  # core's own database and object storage, for the end to end tests
  core-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
      POSTGRES_DB: core
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core -q"]
      interval: 5s
      retries: 20

  data-minio:
    image: quay.io/minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  superset:
    image: ${SUPERSET_TEST_IMAGE:-scystream-superset:test}
    build: .
    command: ["sh", "-c", "/app/docker-init.sh && /app/docker/entrypoints/run-server.sh"]
    environment:
      SUPERSET_SECRET_KEY: superset-integration-test-secret
      SUPERSET_AUTH_TYPE: db
      SUPERSET_ADMIN_USERNAME: admin
      SUPERSET_ADMIN_PASSWORD: admin
    ports:
      - "8088:8088"
    depends_on:
      superset-postgres:
        condition: service_healthy
      data-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
