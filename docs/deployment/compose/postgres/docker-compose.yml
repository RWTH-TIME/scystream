# db host: PostgreSQL for all services. Only reachable from the private
# network (bind to the private address).
name: scystream-db

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?}
      DATA_DB_PASSWORD: ${DATA_DB_PASSWORD:?}
      DATA_READER_PASSWORD: ${DATA_READER_PASSWORD:?}
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=300
    ports:
      - "${PRIVATE_IP:?}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -q"]
      interval: 10s
      retries: 5
    shm_size: 256m
    security_opt: [no-new-privileges:true]

volumes:
  pgdata:
