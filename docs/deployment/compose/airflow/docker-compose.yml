# airflow host: Airflow 3 with CeleryExecutor and a pull-through registry
# cache for compute block images. Private network only.
#
# /srv/airflow/dags is exported via NFS to the app host, where core writes
# the DAG files (see ../../README.md).
name: scystream-airflow

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE:-apache/airflow:3.3.2}
  restart: unless-stopped
  user: "50000:0"
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?}@${DB_HOST:?}:5432/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${AIRFLOW_DB_PASSWORD}@${DB_HOST}:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "10"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
  volumes:
    - /srv/airflow/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
  security_opt: [no-new-privileges:true]
  depends_on: &airflow-depends
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7.2-bookworm
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 30
    security_opt: [no-new-privileges:true]

  airflow-init:
    <<: *airflow-common
    restart: "no"
    command: ["version"]
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      # core reaches Airflow over the private network only
      - "${PRIVATE_IP:?}:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    # the worker starts compute blocks on this host's docker daemon, it is
    # the only component with access to the docker socket
    group_add:
      - "${DOCKER_GID:?}"
    volumes:
      - /srv/airflow/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      <<: *airflow-env
      DUMB_INIT_SETSID: "0"
    depends_on:
      <<: *airflow-depends
      airflow-apiserver:
        condition: service_healthy

  # pull-through cache for compute block images: workers pull
  # localhost:5001/<org>/<image> (CB_IMAGE_REGISTRY_MIRRORS on core)
  registry-cache:
    image: registry:3
    restart: unless-stopped
    environment:
      REGISTRY_PROXY_REMOTEURL: https://ghcr.io
      REGISTRY_PROXY_USERNAME: ${GHCR_USERNAME:-}
      REGISTRY_PROXY_PASSWORD: ${GHCR_TOKEN:-}
      REGISTRY_PROXY_TTL: 168h
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - registry-cache:/var/lib/registry
    security_opt: [no-new-privileges:true]

volumes:
  airflow-logs:
  registry-cache:
